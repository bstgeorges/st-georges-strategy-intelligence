name: Verify business experience

on:
  pull_request:
  push:
    branches: [Jonats]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - run: npm run test:e2e
      - run: npm run cf:build
      - run: npm run cf:dry-run
      - run: npm run verify:workerd
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-evidence-${{ github.run_id }}
          path: |
            output/playwright/
            output/home-slice/
            output/archetypes/
            output/cloudflare-dry-run/
          if-no-files-found: warn
          retention-days: 14
