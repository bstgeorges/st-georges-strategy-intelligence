name: Site release (Cloudflare)

on:
  push:
    branches:
      - main
      - dev
    paths:
      - ".github/workflows/cloudflare-pages-publish.yml"
      - "site/**"
      - "dashboard/regulatory-horizon/**"
      - "scripts/**"
      - "workers/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment target"
        required: true
        default: production
        type: choice
        options:
          - production
          - dev

permissions:
  contents: write

concurrency:
  group: site-release-${{ github.ref_name }}-${{ inputs.target || 'push' }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      SITE_RELEASE_ID: ${{ github.sha }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Select deployment target
        id: target
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.target }}" == "dev" ]] || [[ "${{ github.ref_name }}" == "dev" ]]; then
            echo "name=dev" >> "$GITHUB_OUTPUT"
            echo "branch=dev" >> "$GITHUB_OUTPUT"
            echo "origin=https://dev.st-georges-strategy-intelligence.pages.dev" >> "$GITHUB_OUTPUT"
          else
            echo "name=production" >> "$GITHUB_OUTPUT"
            echo "branch=production" >> "$GITHUB_OUTPUT"
            echo "origin=https://st-georges-strategy-intelligence.pages.dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate published Signals data
        run: npm run signals:validate

      - name: Validate published Signals links
        run: npm run signals:validate:live
        continue-on-error: true

      - name: Audit published Signals source dates
        run: npm run signals:date-audit:ci

      - name: Generate Signals source health report
        run: npm run signals:health:verify

      - name: Publish Signals source health summary
        run: cat dashboard/data/signals-health.generated.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Signals source health artifact
        uses: actions/upload-artifact@v4
        with:
          name: signals-source-health-${{ github.sha }}
          path: |
            dashboard/data/signals-health.generated.json
            dashboard/data/signal-source-date-audit.generated.json
          if-no-files-found: error

      - name: Audit legacy AI Signals data
        run: npm run ai-signals:validate
        continue-on-error: true

      - name: Audit legacy AI Signals links
        run: npm run ai-signals:validate:live
        continue-on-error: true

      - name: Require ordered weekly release inputs
        run: npm run release:order -- --as-of "$(date -u +%F)"

      - name: Require complete weekly release readiness
        run: npm run release:readiness -- --as-of "$(date -u +%F)"

      - name: Build release bundle
        run: npm run site:build

      - name: Verify release bundle
        run: npm run site:verify

      - name: Test public-site edge routing
        run: npm run site:edge:test

      - name: Audit generated links
        run: npm run verify:generated-links

      - name: Deploy Pages bundle
        run: >-
          npx wrangler pages deploy site-dist
          --project-name st-georges-strategy-intelligence
          --branch "${{ steps.target.outputs.branch }}"
          --commit-hash "${{ github.sha }}"

      - name: Synchronize public main Pages alias
        if: steps.target.outputs.name == 'production'
        run: >-
          npx wrangler pages deploy site-dist
          --project-name st-georges-strategy-intelligence
          --branch main
          --commit-hash "${{ github.sha }}"

      - name: Deploy the public site assets Worker
        if: steps.target.outputs.name == 'production'
        run: |
          npm run deploy:cloudflare:edge

      - name: Assign public routes to the site assets Worker
        if: steps.target.outputs.name == 'production'
        run: npm run cloudflare:site:routes

      - name: Purge production host caches
        id: purge
        if: steps.target.outputs.name == 'production'
        run: |
          for attempt in 1 2 3; do
            if npm run cloudflare:cache:purge; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done
          exit 1

      - name: Verify exact deployed release on dev
        if: steps.target.outputs.name == 'dev'
        run: npm run verify:deployed-release -- --origin "${{ steps.target.outputs.origin }}"

      - name: Verify exact deployed release on Pages and production
        if: steps.target.outputs.name == 'production'
        run: npm run verify:deployed-release

      - name: Verify plain crawler responses after cache purge
        if: steps.target.outputs.name == 'production'
        run: npm run verify:deployed-release -- --origin "https://stgeorgesstrategy.com" --plain-crawl

      - name: Verify legacy redirects
        if: steps.target.outputs.name == 'production'
        run: npm run verify:legacy-routes

      - name: Persist dated archive snapshot
        if: steps.target.outputs.name == 'production'
        continue-on-error: true
        run: |
          git config user.name "signals archive bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard/signals-archive
          git diff --cached --quiet || git commit -m "Freeze weekly archive snapshot $(date -u +%F)"
          git push

      - name: Write release summary
        if: always()
        run: |
          {
            echo "## Site release"
            echo "- Release: \`${{ github.sha }}\`"
            echo "- Target: \`${{ steps.target.outputs.name }}\`"
            echo "- Pages origin: ${{ steps.target.outputs.origin }}"
            echo "- Main Pages alias: synchronized on production releases"
            echo "- Cache purge: \`${{ steps.purge.outcome || 'not-required' }}\`"
            echo "- The workflow succeeds only after the deployed release marker and critical asset hashes match this commit."
          } >> "$GITHUB_STEP_SUMMARY"
