name: Cloudflare Workers emergency deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-workers-emergency-deploy
  cancel-in-progress: false

jobs:
  deploy-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      SITE_RELEASE_ID: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build and verify the edge asset bundle
        run: |
          npm run site:build
          npm run site:verify
          npm run site:edge:test
      - name: Deploy the public site assets Worker
        run: |
          npm run deploy:cloudflare:edge
          npm run cloudflare:site:routes
