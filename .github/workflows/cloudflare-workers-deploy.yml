name: Cloudflare Workers deploy

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cloudflare-workers-deploy.yml"
      - "workers/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-workers-deploy
  cancel-in-progress: true

jobs:
  deploy-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy landing route
        run: npm run deploy:cloudflare:landing-route

      - name: Deploy not-found route
        run: npm run deploy:cloudflare:not-found-route

      - name: Deploy SEO route
        run: npm run deploy:cloudflare:seo-route

      - name: Deploy www redirect route
        run: npm run deploy:cloudflare:www-route

      - name: Deploy intelligence legacy redirect route
        run: npm run deploy:cloudflare:route

      - name: Deploy intelligence subdomain route
        run: npm run deploy:cloudflare:subdomain-route

      - name: Deploy AI Signals legacy redirect route
        run: npm run deploy:cloudflare:ai-signals-route

      - name: Deploy Virtual Officer legacy redirect route
        run: npm run deploy:cloudflare:thevirtualofficer-route
