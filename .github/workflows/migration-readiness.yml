name: Migration readiness

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  site-publisher:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install reg-scan dependencies
        run: |
          if [ -f tools/reg-scan/requirements.txt ]; then
            pip install -r tools/reg-scan/requirements.txt
          else
            echo "Skipping reg-scan dependency install; tools/reg-scan/requirements.txt is not present in this repo snapshot."
          fi

      - name: Run reg-scan unit tests
        run: |
          if [ -f tools/reg-scan/requirements.txt ]; then
            REG_SCAN_PYTHON=python npm run reg-scan:test
          else
            echo "Skipping reg-scan unit tests; full reg-scan dependency set is not present in this repo snapshot."
          fi

      - name: Check publisher script syntax
        run: node --check scripts/publish_site_bundle.mjs

      - name: Check horizon sync script syntax
        run: node --check scripts/sync_reg_horizon.mjs

      - name: Verify source site
        run: npm run site:verify

      - name: Build staging-style migration output
        run: npm run site:build

      - name: Audit source registry
        run: npm run sources:audit
