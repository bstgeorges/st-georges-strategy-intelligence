name: Reg Horizon weekly scan

on:
  schedule:
    - cron: "0 6 * * 3" # 06:00 UTC Wednesdays
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reg-horizon-weekly-scan
  cancel-in-progress: false

jobs:
  scan-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install reg-scan dependencies
        run: pip install -r tools/reg-scan/requirements.txt

      - name: Run reg-scan tests
        run: REG_SCAN_PYTHON=python npm run reg-scan:test

      - name: Run live Reg Horizon scan
        run: REG_SCAN_PYTHON=python npm run reg-scan:run

      - name: Sync Reg Horizon outputs into site
        run: npm run horizon:sync

      - name: Verify migration build
        run: npm run site:build

      - name: Commit generated scan outputs
        run: |
          git config user.name "reg-scan bot"
          git config user.email "actions@users.noreply.github.com"
          git add tools/reg-scan/docs tools/reg-scan/state/scan.db dashboard/regulatory-horizon site/regulatory-horizon
          git diff --cached --quiet || git commit -m "Weekly regulatory horizon scan $(date -u +%F)"
          git push
