name: Reg Horizon weekly scan

on:
  schedule:
    - cron: "0 6 * * 0" # 06:00 UTC Sundays; ready for Monday distribution
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Private deadline-discovery lookback in days (defaults to the governed 90-day policy)."
        required: false
        default: "90"
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: reg-horizon-weekly-scan
  cancel-in-progress: false

jobs:
  scan-for-editorial-review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install reg-scan dependencies
        run: pip install -r tools/reg-scan/requirements.txt

      - name: Run reg-scan tests
        run: REG_SCAN_PYTHON=python npm run reg-scan:test

      - name: Run live private deadline-discovery scan
        env:
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '90' }}
        run: |
          case "$LOOKBACK_DAYS" in
            ''|*[!0-9]*) echo "lookback_days must be a whole number" >&2; exit 1 ;;
          esac
          if [ "$LOOKBACK_DAYS" -lt 30 ] || [ "$LOOKBACK_DAYS" -gt 180 ]; then
            echo "lookback_days must be between 30 and 180 days" >&2
            exit 1
          fi
          REG_SCAN_PYTHON=python npm run reg-scan:run -- --window "$LOOKBACK_DAYS"

      - name: Build private deadline register and quality report
        run: |
          npm run deadline-register:build
          npm run deadline-register:validate
          npm run deadline-dashboard:build

      - name: Open generated scan for editorial review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "reg-scan bot"
          git config user.email "actions@users.noreply.github.com"
          branch="automation/reg-horizon-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git add tools/reg-scan/docs tools/reg-scan/state/scan.db dashboard/regulatory-deadline-register
          if git diff --cached --quiet; then
            echo "No Reg Horizon changes to review."
            exit 0
          fi
          git commit -m "Weekly regulatory horizon scan $(date -u +%F)"
          git push --set-upstream origin "$branch"
          if ! gh pr create \
            --base main \
            --head "$branch" \
            --title "Review weekly Reg Horizon scan $(date -u +%F)" \
            --body "Automated scan output for editorial review only. It has not touched the public site, which currently redirects Regulatory Horizon to Archive. Review the private cumulative register, review queue, source health and qa report in dashboard/regulatory-deadline-register alongside classifications and source coverage. A future relaunch requires the private qa gate to pass and an explicit product decision; merging this PR never republishes the page."; then
            echo "::warning::Review branch was pushed, but this repository does not allow GitHub Actions to create pull requests. Open a PR manually from $branch into main."
            echo "Review branch ready: $branch" >> "$GITHUB_STEP_SUMMARY"
          fi
