name: Signals weekly publish draft

on:
  workflow_dispatch:
    inputs:
      publication_date:
        description: "Promotion date (YYYY-MM-DD). Defaults to today's UTC date."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: signals-weekly-publish
  cancel-in-progress: false

jobs:
  draft-weekly-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Determine publication date
        id: vars
        run: |
          publication_date="${{ inputs.publication_date }}"
          if [ -z "$publication_date" ]; then
            publication_date="$(date -u +%F)"
          fi
          echo "publication_date=$publication_date" >> "$GITHUB_OUTPUT"
          echo "branch=automation/weekly-refresh-$publication_date" >> "$GITHUB_OUTPUT"

      - name: Promote fresh Signals candidates into Top 5
        run: npm run signals:promote -- --date "${{ steps.vars.outputs.publication_date }}"

      - name: Draft weekly brief from promoted signals
        run: npm run brief:draft -- --date "${{ steps.vars.outputs.publication_date }}"

      - name: Validate published Signals data
        run: npm run signals:validate

      - name: Validate published Signals data liveness
        run: npm run signals:validate:live

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- site/data/signals.json site/brief/index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open draft PR for review
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "signals weekly publish bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "${{ steps.vars.outputs.branch }}"
          git add site/data/signals.json site/brief/index.html dashboard/data/signals-promotion-log.md dashboard/data/signals-promotion-summary.json
          git commit -m "Weekly Signals + brief refresh draft ${{ steps.vars.outputs.publication_date }}"
          git push origin "${{ steps.vars.outputs.branch }}"

          {
            echo "Auto-drafted weekly refresh for ${{ steps.vars.outputs.publication_date }}. This is preparation, not a completed public edition."
            echo ""
            echo "This promotes fresh, allowlisted candidates into each topic's Top 5 (backfilling with existing rows where nothing fresh cleared review) and regenerates the weekly brief's masthead, so-what, and Top 5 list from the result."
            echo ""
            echo "**Before merge, complete the weekly release contract: align `site/data/current-edition.json`, the committee question, the reviewed Reg Horizon edition, the brief judgement, and the evidence-backed Signals Top 5. Run `npm run release:readiness -- --as-of ${{ steps.vars.outputs.publication_date }}` once that editorial pass is complete.**"
            echo ""
            echo "### Promotion log"
            echo ""
            echo '```'
            cat dashboard/data/signals-promotion-log.md
            echo '```'
            echo ""
            echo "Schema and live-link validation both passed before this PR was opened. Review the diff for topical relevance (automated keyword filtering isn't perfect) before merging."
          } > pr-body.md

          gh pr create \
            --title "Weekly Signals + brief refresh draft (${{ steps.vars.outputs.publication_date }})" \
            --base main \
            --head "${{ steps.vars.outputs.branch }}" \
            --body-file pr-body.md
