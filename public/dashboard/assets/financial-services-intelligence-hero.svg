<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Abstract financial-services intelligence map</title>
  <desc id="desc">A restrained navy field of governance paths, evidence nodes, and market structure lines.</desc>
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1a29"/>
      <stop offset="0.58" stop-color="#112c40"/>
      <stop offset="1" stop-color="#0a1825"/>
    </linearGradient>
    <radialGradient id="signal" cx="76%" cy="28%" r="58%">
      <stop offset="0" stop-color="#c49a4a" stop-opacity="0.2"/>
      <stop offset="0.45" stop-color="#50738a" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#0b1a29" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#b6c3cc" stroke-opacity="0.075"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1600" height="1100" fill="url(#field)"/>
  <rect width="1600" height="1100" fill="url(#signal)"/>
  <rect width="1600" height="1100" fill="url(#grid)"/>

  <g fill="none" stroke="#c49a4a" stroke-linecap="square">
    <path d="M650 890C825 720 830 450 1110 330S1440 265 1580 120" stroke-opacity="0.38" stroke-width="2"/>
    <path d="M770 1000C930 810 970 640 1210 548S1470 470 1610 285" stroke-opacity="0.16"/>
    <path d="M930 1080C1040 910 1185 815 1400 790S1550 720 1640 620" stroke-opacity="0.22"/>
  </g>

  <g fill="none" stroke="#9db0c0" stroke-opacity="0.17">
    <path d="M560 260H980L1130 410H1470"/>
    <path d="M720 430H1050L1230 610H1510"/>
    <path d="M660 690H940L1120 870H1490"/>
    <path d="M880 160V920" stroke-dasharray="3 14"/>
    <path d="M1160 70V1000" stroke-dasharray="3 14"/>
    <path d="M1400 120V940" stroke-dasharray="3 14"/>
  </g>

  <g fill="#0f2233" stroke="#c49a4a">
    <circle cx="980" cy="260" r="8" stroke-opacity="0.7"/>
    <circle cx="1130" cy="410" r="8" stroke-opacity="0.55"/>
    <circle cx="1050" cy="430" r="6" stroke-opacity="0.45"/>
    <circle cx="1230" cy="610" r="9" stroke-opacity="0.6"/>
    <circle cx="940" cy="690" r="7" stroke-opacity="0.5"/>
    <circle cx="1120" cy="870" r="8" stroke-opacity="0.45"/>
    <circle cx="1400" cy="790" r="6" stroke-opacity="0.4"/>
  </g>

  <g fill="none" stroke="#d3dce3" stroke-opacity="0.11">
    <circle cx="1180" cy="470" r="250"/>
    <circle cx="1180" cy="470" r="330" stroke-dasharray="2 18"/>
    <circle cx="1180" cy="470" r="410" stroke-dasharray="1 24"/>
  </g>

  <ellipse cx="1260" cy="310" rx="280" ry="150" fill="#c49a4a" fill-opacity="0.05" filter="url(#soft)"/>
</svg>
